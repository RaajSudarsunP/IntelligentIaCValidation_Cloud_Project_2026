services:
  mongodb:
    image: mongo:7.0
    container_name: iac-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - iac-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-engine:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: iac-ml-engine
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - ML_API_HOST=0.0.0.0
      - ML_API_PORT=9000
      - USE_AWS_BEDROCK=false
      - USE_AWS_CLOUDWATCH=false
    networks:
      - iac-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: iac-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Intelligent IaC Validation Backend
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://localhost:80
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=iac_validation_db
      - AI_ENGINE_URL=http://ml-engine:9000
      - AI_ENGINE_MOCK=false
      - USE_S3_STORAGE=false
    depends_on:
      mongodb:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
    networks:
      - iac-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: iac-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - iac-network

networks:
  iac-network:
    driver: bridge

volumes:
  mongo_data:
